[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spraydrylib"
version = "2.0.0"
description = "Simulación fenomenológica y optimización multiobjetivo de secado spray de leche"
authors = [{ name = "Felipe Huerta", email = "fnhuerta@uc.cl" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "pandas>=1.5.0",
    "matplotlib>=3.6.0",
    "pymoo>=0.6.0",
    "casadi>=3.6.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["spraydrylib*"]
